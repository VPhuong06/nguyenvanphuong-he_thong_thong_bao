# Khởi chạy toàn bộ hệ thống:   docker compose up --build
# Chạy nhiều worker:            docker compose up --build --scale notification-worker=3

x-rabbitmq-env: &rabbitmq-env
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__UserName: ${RABBITMQ_USER}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}

x-db-env: &db-env
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [notify-net]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [notify-net]

  campaign-api:
    build:
      context: .
      dockerfile: src/Campaign.Api/Dockerfile
    environment:
      <<: [*db-env, *rabbitmq-env]
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [notify-net]

  notification-worker:
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    environment:
      <<: [*db-env, *rabbitmq-env]
      RabbitMq__PrefetchCount: ${WORKER_PREFETCH:-10}
      RabbitMq__ConsumerConcurrency: ${WORKER_CONCURRENCY:-1}
      MockSender__FailureRate: ${MOCK_FAILURE_RATE:-0.1}
      DOTNET_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      campaign-api:
        condition: service_started
    restart: unless-stopped
    networks: [notify-net]

  admin-web:
    build:
      context: .
      dockerfile: src/Admin.Web/Dockerfile
    environment:
      CampaignApi__BaseUrl: http://campaign-api:8080
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${ADMIN_PORT:-5001}:8080"
    depends_on:
      - campaign-api
    restart: unless-stopped
    networks: [notify-net]

networks:
  notify-net:

volumes:
  postgres-data:
  rabbitmq-data:
